name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Lint & Test (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code formatting (ruff format)
        run: python -m ruff format --check src tests

      - name: Check linting (ruff check)
        run: python -m ruff check src tests

      - name: Run test suite with pytest & coverage
        run: python -m pytest --cov=src/satbhoomi --cov-report=term-missing tests/
